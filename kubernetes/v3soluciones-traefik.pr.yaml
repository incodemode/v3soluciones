apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: v3soluciones-redirect-to-https
  namespace: default
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: v3soluciones-http-redirect
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: default-v3soluciones-redirect-to-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: v3soluciones.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: v3soluciones
                port:
                  number: 80
    - host: www.v3soluciones.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: v3soluciones
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: v3soluciones-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  rules:
    - host: v3soluciones.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: v3soluciones
                port:
                  number: 80
    - host: www.v3soluciones.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: v3soluciones
                port:
                  number: 80
  tls:
    - hosts:
        - v3soluciones.com
        - www.v3soluciones.com
